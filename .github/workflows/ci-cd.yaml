name: "CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Stage 1: CI Unit Tests (Go & .NET)
  # ==========================================
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: "Run Go Unit Tests"
        run: |
          for SERVICE in "checkoutservice" "frontend" "productcatalogservice" "shippingservice"; do
            echo "::group::Testing $SERVICE"
            pushd src/$SERVICE
            go test -v ./...
            popd
            echo "::endgroup::"
          done

      - name: "Setup .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: "Run .NET Unit Tests"
        run: |
          dotnet test src/cartservice/tests/cartservice.tests.csproj --verbosity normal

  # ==========================================
  # Stage 2: CI Integration & E2E Smoke Test
  # ==========================================
  compose-smoke-test:
    name: "Docker Compose Integration & Smoke Test"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Build and Start Application with Docker Compose"
        run: |
          docker compose up --build -d

      - name: "Wait for Frontend Service Readiness"
        timeout-minutes: 5
        run: |
          echo "Waiting for frontend service to be ready at http://localhost:8080/..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
            echo "Attempt $i: HTTP Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Frontend is ready and responding with HTTP 200!"
              exit 0
            fi
            sleep 3
          done
          echo "Timeout: Frontend service failed to become ready within timeout window."
          exit 1

      - name: "Execute Smoke Test"
        run: |
          echo "Executing Smoke Test against http://localhost:8080/..."
          RESPONSE=$(curl -f -L -sS http://localhost:8080/)
          if echo "$RESPONSE" | grep -qi "Online Boutique"; then
            echo "Smoke test passed: Online Boutique storefront loaded successfully."
          else
            echo "Smoke test failed: Expected homepage content not found in response."
            exit 1
          fi

      - name: "Dump Docker Compose Logs on Failure"
        if: failure()
        run: |
          echo "::group::Docker Compose Logs"
          docker compose logs --tail=100
          echo "::endgroup::"

      - name: "Teardown Docker Compose"
        if: always()
        run: |
          docker compose down

  # ==========================================
  # Stage 3: CD Deployment to Render
  # ==========================================
  deploy-to-render:
    name: "Deploy to Render"
    needs: compose-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: "Trigger Render Deploy Hook"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub Repository Secrets."
            echo "Please configure RENDER_DEPLOY_HOOK_URL in repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering Render deployment via deploy hook..."
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Render response body: $BODY"
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully triggered Render deployment!"
          else
            echo "Failed to trigger Render deployment. Received HTTP status: $HTTP_STATUS"
            exit 1
          fi
