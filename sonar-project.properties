# Replace with values from SonarQube Cloud
sonar.organization=hanson92828
sonar.projectKey=hanson92828_ai-software-dev-demo

# Disable auto configuration to avoid scanning all directories in the project
sonar.scanner.autoconfig.enabled=false

# Analyze only Email Service
sonar.sources=src/emailservice

# Test directory
sonar.tests=src/emailservice/tests

# Exclude tests from production source analysis
# Also exclude generated Protobuf code
sonar.exclusions=src/emailservice/tests/**,src/emailservice/*_pb2.py,src/emailservice/*_pb2_grpc.py

sonar.sourceEncoding=UTF-8