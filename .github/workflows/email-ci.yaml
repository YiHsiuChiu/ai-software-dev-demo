name: Email Service CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/emailservice/**"
      - ".github/workflows/email-ci.yml"
  pull_request:
    paths:
      - "src/emailservice/**"
      - ".github/workflows/email-ci.yml"

permissions:
  contents: read

jobs:
  email-service:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t emailservice-ci \
            ./src/emailservice

      # Run Unit Tests
      - name: Run Unit Tests
        run: |
          docker run --rm \
            --entrypoint sh \
            emailservice-ci \
            -c "pip install --no-cache-dir pytest==8.4.2 && python -m pytest -v tests/test_email.py"

      # Start Email Server
      - name: Start Email Server
        run: |
          docker run -d \
            --name emailservice-ci \
            -e PORT=8080 \
            -e DISABLE_PROFILER=1 \
            emailservice-ci
            
      # Smoke Test
      - name: Verify Email Service Health
        run: |
          docker exec -i emailservice-ci python - <<'PY'
          import grpc
          from grpc_health.v1 import health_pb2, health_pb2_grpc

          with grpc.insecure_channel("localhost:8080") as channel:
              grpc.channel_ready_future(channel).result(timeout=30)

              client = health_pb2_grpc.HealthStub(channel)
              response = client.Check(
                  health_pb2.HealthCheckRequest(),
                  timeout=10
              )

              assert response.status == health_pb2.HealthCheckResponse.SERVING
              print("PASS: Email service is healthy!")
          PY

      # Show logs
      - name: Show Server Logs
        if: always()
        run: docker logs emailservice-ci || true

      # Cleanup
      - name: Cleanup
        if: always()
        run: docker rm -f emailservice-ci || true

  
